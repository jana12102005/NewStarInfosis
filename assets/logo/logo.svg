<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CD9FF" />
      <stop offset="35%" stop-color="#5865F2" />
      <stop offset="70%" stop-color="#B377F3" />
      <stop offset="100%" stop-color="#FF6AEF" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15F5BA" />
      <stop offset="100%" stop-color="#8CD9FF" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B377F3" />
      <stop offset="100%" stop-color="#FF6AEF" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(250, 160)">
    <!-- Outer Rings -->
    <circle r="120" fill="none" stroke="url(#cyberGrad)" stroke-width="6" opacity="0.85" filter="url(#glowEffect)" />
    <circle r="102" fill="none" stroke="#2C2F33" stroke-width="2.5" opacity="0.6" />

    <!-- Left Speed Wings -->
    <g stroke="url(#neonCyan)" stroke-width="4.5" stroke-linecap="round" opacity="0.9">
      <line x1="-190" y1="-28" x2="-100" y2="-28" />
      <line x1="-205" y1="-10" x2="-95" y2="-10" stroke-width="5" />
      <line x1="-215" y1="8" x2="-90" y2="8" stroke-width="5" />
      <line x1="-205" y1="26" x2="-95" y2="26" stroke-width="5" />
      <line x1="-190" y1="44" x2="-100" y2="44" />
    </g>

    <!-- Right Speed Wings -->
    <g stroke="url(#neonPink)" stroke-width="4.5" stroke-linecap="round" opacity="0.9">
      <line x1="100" y1="-28" x2="190" y2="-28" />
      <line x1="95" y1="-10" x2="205" y2="-10" stroke-width="5" />
      <line x1="90" y1="8" x2="215" y2="8" stroke-width="5" />
      <line x1="95" y1="26" x2="205" y2="26" stroke-width="5" />
      <line x1="100" y1="44" x2="190" y2="44" />
    </g>

    <!-- Sparkle Accents -->
    <g fill="#8CD9FF" opacity="0.85">
      <path d="M 125,-90 L 129,-82 L 137,-82 L 131,-77 L 133,-69 L 125,-74 L 117,-69 L 119,-77 L 113,-82 L 121,-82 Z" transform="scale(0.7) translate(70, -40)" />
      <circle cx="-135" cy="-80" r="3.5" />
      <circle cx="120" cy="85" r="3" />
      <circle cx="-120" cy="85" r="3" />
    </g>

    <!-- 5-Point Star Body -->
    <polygon points="0,-130 38,-40 135,-32 60,35 84,130 0,78 -84,130 -60,35 -135,-32 -38,-40"
             fill="#18173E" stroke="url(#cyberGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glowEffect)" />

    <!-- Inner Star Accent Layer -->
    <polygon points="0,-115 32,-35 118,-28 52,30 73,115 0,68 -73,115 -52,30 -118,-28 -32,-35"
             fill="#1F1D5D" stroke="#2C2F33" stroke-width="2" opacity="0.7" />

    <!-- Center Tech Monitor Screen -->
    <g transform="translate(0, 5)">
      <!-- Monitor Frame -->
      <rect x="-42" y="-35" width="84" height="56" rx="8" fill="#141330" stroke="url(#cyberGrad)" stroke-width="5" />
      <!-- Display Glare / Inner Screen -->
      <rect x="-35" y="-28" width="70" height="42" rx="4" fill="url(#cyberGrad)" opacity="0.25" />
      <line x1="-28" y1="-14" x2="0" y2="-14" stroke="#15F5BA" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-28" y1="-4" x2="18" y2="-4" stroke="#8CD9FF" stroke-width="2" stroke-linecap="round" />
      <line x1="-28" y1="5" x2="-8" y2="5" stroke="#FF6AEF" stroke-width="2" stroke-linecap="round" />
      <!-- Stand Base -->
      <path d="M -10,21 L -16,33 L 16,33 L 10,21 Z" fill="url(#cyberGrad)" />
      <rect x="-24" y="33" width="48" height="5" rx="2.5" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>

  <!-- Typography -->
  <text x="250" y="365" font-family="'Archivo', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">NEW STAR</text>
  
  <!-- Subtitle with side lines -->
  <g transform="translate(250, 395)">
    <line x1="-180" y1="-8" x2="-95" y2="-8" stroke="url(#cyberGrad)" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="0" font-family="'Archivo', 'Inter', sans-serif" font-weight="700" font-size="22" fill="#8CD9FF" letter-spacing="9" text-anchor="middle">INFOSIS</text>
    <line x1="95" y1="-8" x2="180" y2="-8" stroke="url(#cyberGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
